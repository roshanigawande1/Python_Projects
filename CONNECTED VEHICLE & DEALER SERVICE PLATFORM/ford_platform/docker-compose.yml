# docker-compose.yml
#
# Runs TWO containers together and connects them on a shared network:
#   - "db":  a PostgreSQL database
#   - "web": our Django API (built from the Dockerfile), talking to "db"
#
# Run with:  docker compose up --build

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ford_platform
      POSTGRES_USER: app
      POSTGRES_PASSWORD: change-me
    volumes:
      - postgres_data:/var/lib/postgresql/data   # Persists DB data even if the container restarts

  web:
    build: .
    environment:
      DJANGO_SECRET_KEY: local-only-secret
      DEBUG: "false"
      DB_ENGINE: postgres
      DB_NAME: ford_platform
      DB_USER: app
      DB_PASSWORD: change-me
      DB_HOST: db          # Docker Compose lets containers reach each other by service name
      DB_PORT: "5432"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
    ports:
      - "8000:8000"        # Maps container port 8000 to your laptop's port 8000
    depends_on:
      - db

volumes:
  postgres_data:
